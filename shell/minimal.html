<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跑步数据仪表盘</title>
<link rel="stylesheet" href="minimal.css">
</head>
<body>

<!--
  极简外壳（零侵入）
  ----------------------------------------------------------------------------
  结构只有两层：一个铺满窗口的页面块 + 里面填满它的 iframe。
  没有装饰（无圆角/阴影/模糊/光斑）、没有居中、**不固定页面尺寸**。

  清晰度的关键：基准状态下外壳对渲染**零干预** ——
    页面宽度 = 窗口宽度、高度 = 看板内容高度，不加 transform、不缩放，
    与直接打开 index.html 逐像素一致。只有 Ctrl+滚轮放大时才动 transform，
    按 0 立即回到这个"零干预"状态。

  浏览器整页缩放会连尺寸和清晰度一起破坏（尤其整页缩小 → 低分辨率栅格化），
  所以：① 外壳拦掉 Ctrl+滚轮（同源时连帧内事件都转发出来）；② 万一已经被
  浏览器缩小了，按 dpr 比值把尺寸中性还原（见下方 browserZoom 注释）。

  交互：
    Ctrl（或 ⌘）+ 滚轮   以指针位置为锚点放大（1× ~ 4×）
    按住 Ctrl + 拖动      平移（也可以直接拖浏览器原生滚动条）
    0                    回到基准（1×，零缩放）
    ?zoom=2              打开时直接给个倍率（截图 / 分享某个视角用）

  为什么是 iframe：抄一份看板的 HTML 就等于复制 index.html/app.js，
  看板以后每改一次这里就过期一次，而且复制品里的 #id 会和原件打架。
-->
<div class="minimal-wrapper">
  <div class="minimal-page" id="page">
    <iframe class="minimal-frame" id="app" src="../index.html" title="跑步数据仪表盘"></iframe>
  </div>
</div>

<!-- 接管层：只在按住 Ctrl 时铺开。
     iframe 内部是独立文档，滚轮事件在它里面就被处理掉了，外壳收不到 ——
     所以 Ctrl+滚轮必须先有一层把指针事件收回来，否则永远触发不了缩放。 -->
<div class="zoom-layer" id="zoomLayer" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var page = document.getElementById('page');
  var frame = document.getElementById('app');
  var layer = document.getElementById('zoomLayer');

  var MAX = 4;          // 放大上限
  var STEP = 1.12;      // 每一格滚轮的倍率
  var zoom = 1;         // 当前倍率（1 = 看板原始尺寸，也是基准）

  /* ---- 中和浏览器整页缩放 ----------------------------------------------
     参考 dpr 取下限 1：操作系统的显示缩放永远是 1.0 / 1.25 / 2.0… 不会小于 1，
     所以 dpr/dpr0 < 1 只可能是"浏览器整页缩小"。它会让页面按更低分辨率栅格化
     （又小又糊），所以在尺寸上中性还原回去，让有效渲染倍率回到 1。
     只中和缩小、不处理放大：放大是用户显式动作，且换到高 DPI 屏幕时 dpr 会变大，
     一刀切会让页面突然缩一半（min(1, …) 这一层就是防这个）。 */
  var dpr0 = Math.max(1, window.devicePixelRatio || 1);
  function browserZoom() {
    return Math.min(1, (window.devicePixelRatio || 1) / dpr0);
  }

  /* 页面 px → CSS px 的实际倍率 */
  function cssScale() { return zoom / browserZoom(); }

  /* 基准就是 1×（看板原始尺寸铺满窗口）——不允许比它更小，
     所以"缩小到角落里一小块"这种状态不可能出现。 */
  function clampZoom(k) { return Math.min(MAX, Math.max(1, k)); }

  function render() {
    var s = cssScale();
    page.style.setProperty('--zoom', s);
    /* s ≈ 1（基准）时**不下 transform**：即便 scale(1) 也会把 iframe 提成合成层，
       在分数 dpr / 浏览器整页缩放下可能被重采样 → "整页发虚"。
       只有真的放大过才动 transform。 */
    frame.style.transform = (Math.abs(s - 1) < 0.002) ? 'none' : 'scale(' + s + ')';
  }

  /* 以视口坐标 (cx, cy) 为锚点放大：放大前后，指针底下那一点内容必须停在原处。 */
  function zoomAt(next, cx, cy) {
    next = clampZoom(next);
    if (Math.abs(next - zoom) < 1e-4) return;
    var r = page.getBoundingClientRect();
    var offX = r.left + window.scrollX;
    var offY = r.top + window.scrollY;
    var s0 = cssScale();
    var u = (window.scrollX + cx - offX) / s0;
    var v = (window.scrollY + cy - offY) / s0;
    zoom = next;
    render();
    var s1 = cssScale();
    window.scrollTo(Math.round(offX + u * s1 - cx), Math.round(offY + v * s1 - cy));
  }

  function reset() {
    zoomAt(1, window.innerWidth / 2, window.innerHeight / 2);
  }

  function setLayer(on) { layer.classList.toggle('on', !!on); }

  /* ---- 通道 1：事件落在外壳自己身上（页面空白处 / 接管层） ---- */
  window.addEventListener('wheel', function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();                        // 拦住浏览器自己的整页缩放
    zoomAt(zoom * (e.deltaY < 0 ? STEP : 1 / STEP), e.clientX, e.clientY);
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Control' || e.key === 'Meta') { setLayer(true); return; }
    if (e.key === '0' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); reset(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'Control' || e.key === 'Meta') setLayer(false);
  });
  window.addEventListener('blur', function () { setLayer(false); });

  /* 窗口尺寸变化 / 浏览器缩放变化：重绘（会把 dpr 变化一并吸收） */
  window.addEventListener('resize', function () { render(); });

  /* ---- 通道 2：事件落在 iframe 内部（同源才能转发） ----
     点击过看板之后，键盘焦点在 iframe 里，父页面收不到 Ctrl 的 keydown/keyup，
     接管层就出不来。所以同源时往帧内注入一段转发：Ctrl 状态与 Ctrl+滚轮
     都 postMessage 回来。跨源（file://）没有这个通道 —— 那种模式下请用
     「打开看板.cmd」（本机 http，同源）。 */
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow) return;      // 只认自己那个帧
    var d = e.data || {};
    if (d.t === 'ctrl') { setLayer(d.on); return; }
    if (d.t === 'wheel') {
      var r = frame.getBoundingClientRect();
      var s = cssScale();
      var factor = d.d < 0 ? STEP : 1 / STEP;
      zoomAt(zoom * factor, r.left + d.x * s, r.top + d.y * s);
    }
  });

  /* ---- 接管层：滚轮缩放（走通道 1），拖动平移 ---- */
  var drag = null;
  layer.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY };
    layer.classList.add('dragging');
    try { layer.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  layer.addEventListener('pointermove', function (e) {
    if (!drag) return;
    window.scrollBy(drag.x - e.clientX, drag.y - e.clientY);   // 拖动 = 原生滚动
    drag.x = e.clientX;
    drag.y = e.clientY;
  });
  function endDrag(e) {
    drag = null;
    layer.classList.remove('dragging');
    try { layer.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  layer.addEventListener('pointerup', endDrag);
  layer.addEventListener('pointercancel', endDrag);

  /* ---- 初始倍率 ---- */
  var preset = parseFloat(new URLSearchParams(location.search).get('zoom'));
  if (preset > 0) zoom = clampZoom(preset);
  render();

  /* ---- 同源才能做的两件事：只读注入 + 量出看板真实内容高度 ---- */
  var inner = null, ro = null, lastH = 0;

  /* 帧高 = 看板内容高 → 帧内不再滚动，滚动只剩浏览器那一条（落在窗口右缘）。
     量法要点：不能直接用 documentElement.scrollHeight —— 帧高大于内容时它会返回
     帧高本身，于是"永远缩不回去"。所以：用 body 的高度收缩、用 scrollHeight 只在
     内容真的溢出时放大。 */
  function syncHeight() {
    if (!inner || !inner.body) return;
    var body = inner.body;
    var frameH = frame.offsetHeight;
    var bodyH = Math.max(body.offsetHeight, body.scrollHeight);
    var docH = inner.documentElement.scrollHeight;
    var h = Math.ceil(Math.max(bodyH, docH > frameH + 1 ? docH : 0));
    if (!(h > 0)) return;
    if (Math.abs(h - lastH) < 2) return;          // 抖动阈值，防 1px 反复重排
    lastH = h;
    page.style.setProperty('--content-h', (h + 2) + 'px');   // +2 余量，杜绝贴边出现内层滚动条
    page.dataset.contentH = String(h);            // 便于排查：dump-dom 就能看到
  }

  function inject() {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }
    if (!doc || !doc.documentElement) {
      // 跨源（file://）：量不到真实高度，给个够高的兜底，避免帧内出现滚动条
      page.style.setProperty('--content-h', '2400px');
      return;
    }
    inner = doc;

    var css = doc.getElementById('__minimal__');
    if (!css) {
      css = doc.createElement('style');
      css.id = '__minimal__';
      (doc.head || doc.documentElement).appendChild(css);
    }
    css.textContent = [
      '*:not(input):not(textarea){user-select:none !important;-webkit-user-select:none !important;}',
      '.edit,.toolbar,[data-edit],.row-actions{display:none !important;}',
      'html,body{cursor:default !important;}',
      'input[type="text"],input[type="search"],input:not([type]),textarea{cursor:text !important;}'
    ].join('');

    if (!doc.getElementById('__minimal_fwd__')) {
      var s = doc.createElement('script');
      s.id = '__minimal_fwd__';
      s.textContent = (
        'var M=function(t,o){o.t=t;parent.postMessage(o,"*")};' +
        'addEventListener("wheel",function(e){if(!(e.ctrlKey||e.metaKey))return;' +
        'e.preventDefault();M("wheel",{x:e.clientX,y:e.clientY,d:e.deltaY});},{passive:false});' +
        'addEventListener("keydown",function(e){if(e.key==="Control"||e.key==="Meta")M("ctrl",{on:true});});' +
        'addEventListener("keyup",function(e){if(e.key==="Control"||e.key==="Meta")M("ctrl",{on:false});});'
      );
      (doc.body || doc.documentElement).appendChild(s);
    }

    syncHeight();
    // 窗口宽度变化 → 看板重排 → 高度变；切页签同理。靠它跟上。
    if (typeof ResizeObserver !== 'undefined' && !ro) {
      ro = new ResizeObserver(function () { requestAnimationFrame(syncHeight); });
      ro.observe(doc.documentElement);
      ro.observe(doc.body);
    }
  }

  frame.addEventListener('load', inject);
  inject();
})();
</script>
</body>
</html>
